<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Les tuiles OpenStreetMap exigent un en-tête Referer : on garde l'origine -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SecteurImmo – Suivi de prospection</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Carte plein écran -->
  <div id="map" aria-label="Carte de prospection"></div>

  <!-- Barre de recherche (ville ou adresse) -->
  <div id="recherche" role="search">
    <form id="recherche-form" autocomplete="off">
      <input id="recherche-input" type="search" placeholder="Rechercher une ville ou une adresse…"
             aria-label="Rechercher une ville ou une adresse" aria-controls="suggestions" autocomplete="off">
      <button type="submit" aria-label="Lancer la recherche">🔍</button>
    </form>
    <ul id="suggestions" role="listbox" hidden></ul>
  </div>

  <!-- Messages courts (erreurs réseau, infos) -->
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Scripts classiques (pas de modules ES) : l'ordre compte -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/geocode.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
